name: Compilar clientes

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar cliente Tauri
        run: pnpm --filter @nacio/desktop tauri build --bundles nsis

      - name: Subir instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux:
    name: Linux
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            rpm \
            cpio

      - name: Instalar dependencias del proyecto
        run: pnpm install --frozen-lockfile

      - name: Compilar paquetes Linux
        run: pnpm --filter @nacio/desktop tauri build --bundles appimage,deb,rpm

      - name: Armar binario portable
        run: |
          mkdir -p portable
          BIN="apps/desktop/src-tauri/target/release/messenger-el-nacio"
          if [ ! -f "$BIN" ]; then
            BIN=$(find apps/desktop/src-tauri/target/release -maxdepth 1 -type f -perm -u+x -name '*essenger*' | head -1)
          fi
          cp "$BIN" portable/messenger-el-nacio
          tar -czf apps/desktop/src-tauri/target/release/bundle/messenger-el-nacio_0.1.1_linux-x64.tar.gz -C portable messenger-el-nacio

      - name: Subir paquetes como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/*.tar.gz
          if-no-files-found: error

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Crear release con todos los paquetes
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
