name: Compilar clientes

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Leer versión
        shell: bash
        run: echo "VERSION=$(node -p 'require("./apps/desktop/package.json").version')" >> "$GITHUB_ENV"

      - name: Compilar cliente Tauri
        run: pnpm --filter @nacio/desktop tauri build --bundles nsis

      - name: Renombrar instalador
        shell: bash
        run: |
          cd apps/desktop/src-tauri/target/release/bundle/nsis
          for file in *.exe; do
            mv "$file" "Messenger.El.Nacio-${VERSION}-Windows-x64-Setup.exe"
          done

      - name: Subir instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Messenger.El.Nacio-Windows-x64
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux:
    name: Linux
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            rpm \
            cpio

      - name: Instalar dependencias del proyecto
        run: pnpm install --frozen-lockfile

      - name: Leer versión
        run: echo "VERSION=$(node -p 'require("./apps/desktop/package.json").version')" >> "$GITHUB_ENV"

      - name: Compilar paquetes Linux
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: pnpm --filter @nacio/desktop tauri build --bundles appimage,deb,rpm

      - name: Armar binario portable
        run: |
          mkdir -p portable
          BIN="apps/desktop/src-tauri/target/release/messenger-el-nacio"
          if [ ! -f "$BIN" ]; then
            BIN=$(find apps/desktop/src-tauri/target/release -maxdepth 1 -type f -perm -u+x -name '*essenger*' | head -1)
          fi
          cp "$BIN" portable/messenger-el-nacio
          tar -czf "apps/desktop/src-tauri/target/release/bundle/Messenger.El.Nacio-${VERSION}-Linux-Portable-x86_64.tar.gz" -C portable messenger-el-nacio

      - name: Renombrar paquetes
        run: |
          bundle="apps/desktop/src-tauri/target/release/bundle"
          mv "$bundle"/appimage/*.AppImage "$bundle/appimage/Messenger.El.Nacio-${VERSION}-Linux-AppImage-x86_64.AppImage"
          mv "$bundle"/deb/*.deb "$bundle/deb/Messenger.El.Nacio-${VERSION}-Linux-Ubuntu-Debian-amd64.deb"
          mv "$bundle"/rpm/*.rpm "$bundle/rpm/Messenger.El.Nacio-${VERSION}-Linux-Fedora-openSUSE-x86_64.rpm"
          ls -lh "$bundle/appimage" "$bundle/deb" "$bundle/rpm" "$bundle"/*.tar.gz

      - name: Subir paquetes como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Messenger.El.Nacio-Linux-x86_64
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/*.tar.gz
          if-no-files-found: error

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Crear release con todos los paquetes
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
